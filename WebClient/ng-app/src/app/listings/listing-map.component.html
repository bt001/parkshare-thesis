<div class="map-actions"><button class="map-area-action" type="button" (click)="searchBounds()">Search this area</button>
<button class="map-area-action secondary" type="button" (click)="searchCentre()">Search within {{ radiusKm }} km of map centre</button>
</div>
<div class="map-frame" role="region" aria-label="Active parking listings map">
  <div #mapContainer class="map-container"></div>
  @if (isTileUnavailable) {
    <p class="tile-warning" role="status">
      Map tiles are temporarily unavailable. Listing markers may still be selected.
    </p>
  }
</div>

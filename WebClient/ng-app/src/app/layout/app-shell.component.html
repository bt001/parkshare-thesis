<div class="shell">
  <header class="shell-header">
    <div>
      <p class="brand-kicker">ParkShare MVP</p>
      <a routerLink="/dashboard" class="brand-link">ParkShare</a>
    </div>

    <nav class="shell-nav" aria-label="Primary navigation">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
      <a routerLink="/listings" routerLinkActive="active">Browse parking</a>
      <a routerLink="/owner/listings" routerLinkActive="active">{{ authService.hasRole('Owner') ? 'Owner workspace' : 'List your space' }}</a>
      <button type="button" (click)="logout()">Log out</button>
    </nav>
  </header>

  <section class="session-banner">
    <div>
      <p class="session-label">Current session</p>
      <strong>{{ authService.session?.name || authService.session?.userName || 'Authenticated user' }}</strong>
    </div>
    <div class="session-meta">
      <span>{{ authService.session?.email }}</span>
      <span>{{ authService.session?.role }}</span>
    </div>
  </section>

  <main class="shell-content">
    <router-outlet />
  </main>
</div>
